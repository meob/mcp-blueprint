name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy typecheck
        run: uv run mypy blueprint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: uv run pytest -q \
          --ignore tests/test_pack_pg_dba.py \
          --ignore tests/test_pack_mysql_dba.py \
          --ignore tests/test_pack_sakila.py \
          --ignore tests/test_pack_engine_integration.py

  integration:
    name: Integration (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            files: -f docker-compose.yaml -f docker-compose.ci.yaml
            service: postgres
            tests: tests/test_pack_pg_dba.py
          - engine: mysql
            files: -f docker-compose.databases.yaml
            service: mysql
            tests: tests/test_pack_mysql_dba.py
          - engine: oracle
            files: -f docker-compose.databases.yaml
            service: oracle
            tests: tests/test_pack_engine_integration.py -k oracle
          - engine: clickhouse
            files: -f docker-compose.databases.yaml
            service: clickhouse
            tests: tests/test_pack_engine_integration.py -k clickhouse
          - engine: sqlserver
            files: -f docker-compose.databases.yaml
            service: sqlserver
            tests: tests/test_pack_engine_integration.py -k sqlserver
          - engine: mariadb
            files: -f docker-compose.databases.yaml
            service: mariadb
            tests: tests/test_pack_engine_integration.py -k mariadb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Start ${{ matrix.engine }} database
        run: docker compose ${{ matrix.files }} up -d --wait --timeout 900 ${{ matrix.service }}

      - name: Run integration tests
        env:
          MCP_BLUEPRINT_DATABASE_URL: postgresql://monitor:monitor@localhost:5432/pgbench
          MCP_BLUEPRINT_MYSQL_URL: mysql://monitor:monitor_pw@localhost:3308/mysakila
          MCP_BLUEPRINT_ORACLE_URL: oracle://monitor:monitor_pw@localhost:1521/FREEPDB1
          MCP_BLUEPRINT_CLICKHOUSE_URL: clickhouse://monitor:monitor_pw@localhost:9000/default
          MCP_BLUEPRINT_SQLSERVER_URL: "sqlserver://sa:YourStrong!Passw0rd@localhost:1433/master"
          MCP_BLUEPRINT_MARIADB_URL: mariadb://monitor:monitor_pw@localhost:3307/mysakila
        run: uv run pytest -q ${{ matrix.tests }}
