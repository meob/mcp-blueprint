name: search_customer
description: >-
  Find customers by a first or last name substring.  Use this first when a
  customer asks about their account, then call get_customer_rentals with the
  resulting customer_id to check their rental situation.
parameters:
  name:
    type: string
    required: true
    description: Name or part of a name to search for.
sql: ../sql/search_customer.sql
cache:
  ttl: 30
