name: search_customer
description: >-
  Find customers by name.  Accepts a first name, a last name, or a full name
  such as 'Tammy Sanders'; matching is case-insensitive.  Returns the
  matching customers with their customer_id.  Use this to identify a customer
  before other tools, or to check whether a customer exists.
parameters:
  name:
    type: string
    required: true
    description: First name, last name, or full name to search for.
sql: ../sql/search_customer.sql
cache:
  ttl: 30
