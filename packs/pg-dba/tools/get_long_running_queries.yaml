name: get_long_running_queries
description: Return queries that have been running longer than a threshold.

parameters:
  min_seconds:
    type: integer
    required: false
    default: 60
    description: Minimum query duration in seconds.
  database:
    type: string
    required: false
    description: Optional database name filter.

sql: ../sql/get_long_running_queries.sql

cache:
  ttl: 10
