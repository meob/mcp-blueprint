name: search_films
description: >-
  Recommend films by optional title substring, category and rating.  Results
  are ordered by popularity (number of rentals) and include available copies.
  rating accepts the codes G, PG, PG-13, R, NC-17; rating_label and min_age
  explain what each code means.
parameters:
  title:
    type: string
    required: false
    default: null
    description: Case-insensitive substring matched against the film title.
  category:
    type: string
    required: false
    default: null
    description: Film category name, e.g. Comedy, Drama, Sci-Fi, Family.
  rating:
    type: string
    required: false
    default: null
    description: MPAA rating code, one of G, PG, PG-13, R, NC-17.
sql: ../sql/search_films.sql
cache:
  ttl: 30
