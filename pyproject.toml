[project]
name = "mcp-blueprint"
version = "0.2.0"
description = "Build domain-oriented MCP servers from configuration files, SQL queries and metadata."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MCP Blueprint Contributors" }]
keywords = ["mcp", "fastmcp", "sql", "postgresql", "mysql", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "structlog>=24.0",
    "cachetools>=5.3",
    "asyncmy>=0.2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "prometheus-client>=0.20",
]
metrics = [
    "prometheus-client>=0.20",
]
oracle = [
    "oracledb>=3.3",
]
clickhouse = [
    "clickhouse-driver>=0.2.7",
]
sqlserver = [
    "pyodbc>=5.0",
]
databases = [
    "oracledb>=3.3",
    "clickhouse-driver>=0.2.7",
    "pyodbc>=5.0",
]

[project.scripts]
blueprint = "blueprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blueprint"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["blueprint", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["blueprint"]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL instance",
]

[tool.uv]
package = true
