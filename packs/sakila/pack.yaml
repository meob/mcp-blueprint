name: sakila
version: 0.5.0
engines: [postgresql]
description: >-
  Sakila DVD rental store pack.  Domain-oriented tools that encapsulate
  business logic server-side instead of leaving multi-step reasoning to the
  model: customer account summaries, film recommendations and per-store
  stock.  Requires the Sakila sample database for PostgreSQL.
instructions: >-
  For a rental request, call customer_account_summary with the customer's
  name to inspect their account and recommend_films to suggest titles.
  Use rental_history for questions about films a customer has rented in the
  past, and film_stock for stock questions about a specific film.  If the
  customer is not found, say so instead of inventing an account.
