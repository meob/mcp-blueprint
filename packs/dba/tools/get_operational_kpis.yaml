name: get_operational_kpis
description: >-
  Operational health KPIs with status: connection usage, active/idle
  sessions, waiting locks, long running queries and oldest transaction age.
  Returns one row per KPI (kpi_name, current_value, unit,
  suggested_threshold, status).
sql:
  postgresql: ../sql/postgresql/get_operational_kpis.sql
  mysql: ../sql/mysql/get_operational_kpis.sql
cache:
  ttl: 10
