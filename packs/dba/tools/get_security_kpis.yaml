name: get_security_kpis
description: >-
  Security KPIs with status: superuser login roles, login roles, expired
  passwords and accounts without a password or anonymous.  Returns one row
  per KPI (kpi_name, current_value, unit, suggested_threshold, status).
sql:
  postgresql: ../sql/postgresql/get_security_kpis.sql
  mysql: ../sql/mysql/get_security_kpis.sql
cache:
  ttl: 60
